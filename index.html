<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plus Alpha Agency</title>
<meta name="description" content="Talent, business and ventures from Seoul.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
:root{--paper:#fff;--ink:#202020;--muted:#7c7c7c;--line:#dedede;--rail:#d7d7d7;--pad:clamp(22px,4.5vw,72px);--header:68px}
html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:#fff}

.header{position:fixed;z-index:10;inset:0 0 auto;height:var(--header);padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.logo-crop{display:block;width:46px;height:20px;overflow:hidden}
.logo-crop img{display:block;width:92px;height:92px;max-width:none;transform:translate(-23px,-36.9px)}
.brand-name{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.header-nav{display:flex;align-items:center;gap:26px}
.header-nav a{font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.065em;color:#555}
.header-nav a:hover{color:#000}
.client{padding:8px 10px;border:1px solid #bdbdbd}

.hero{position:relative;min-height:calc(100svh - 68px);padding:calc(var(--header) + 42px) var(--pad) 44px;display:grid;grid-template-rows:1fr;overflow:hidden}
.rail{position:absolute;inset:var(--header) auto 0 0;width:clamp(10px,1.5vw,24px);background:var(--rail)}
.meta{margin:0;font-size:12px;line-height:1.5;text-transform:uppercase;letter-spacing:.075em;color:var(--muted)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between}
.alpha-wrap{display:grid;place-items:center}
.alpha{display:inline-flex;align-items:center;justify-content:center;width:48px;height:29px;background:#000;color:#fff;font-size:22px;line-height:1}
.alpha b{font-family:Arial,sans-serif;font-weight:300}
.alpha i{font-family:Georgia,serif;font-weight:700;transform:skew(-10deg) translateY(-1px)}
.hero-bottom{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(280px,1.28fr);gap:clamp(48px,8vw,128px);align-items:end}
.hero-title{margin:0;font-size:clamp(18px,1.85vw,28px);line-height:1.24;font-weight:500;letter-spacing:-.02em}
.hero-copy{justify-self:end;width:min(100%,600px);max-width:600px;margin:0;font-size:14px;line-height:1.62;color:#595959}
.hero-copy strong{font-weight:500;color:var(--ink)}
.site-footer{min-height:68px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.site-footer a,.site-footer span{font-size:10px;line-height:1.4;text-transform:uppercase;letter-spacing:.07em;color:#858585}

.work{min-height:76svh;padding:72px var(--pad) 64px;border-top:1px solid var(--line)}
.work-head{display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:18px;border-bottom:1px solid #aaa}
.work-head span{font-size:12px;line-height:1.4;text-transform:uppercase;letter-spacing:.075em;color:var(--muted)}
.work-intro{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(280px,1.28fr);gap:clamp(48px,8vw,128px);padding:38px 0 54px}
.work-intro h2{max-width:17ch;margin:0;font-size:clamp(20px,2vw,30px);line-height:1.25;font-weight:500;letter-spacing:-.025em}
.work-intro p{max-width:560px;margin:0;font-size:15px;line-height:1.65;color:#666}
.services{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #aaa;border-bottom:1px solid var(--line)}
.service{min-height:170px;padding:20px 22px 22px 0}
.service+.service{padding-left:22px;border-left:1px solid var(--line)}
.service-number{display:block;font-size:11px;letter-spacing:.08em;color:#999}
.service h3{margin:36px 0 10px;font-size:17px;font-weight:500;letter-spacing:-.01em}
.service p{max-width:30ch;margin:0;font-size:13px;line-height:1.55;color:#747474}
.footer{display:flex;justify-content:space-between;padding-top:36px}
.footer a,.footer span{font-size:11px;line-height:1.4;text-transform:uppercase;letter-spacing:.075em;color:#8a8a8a}

@media(max-width:720px){
  :root{--header:92px}
  .logo-crop{position:absolute;top:20px;left:var(--pad);width:42px;height:18px}
  .logo-crop img{width:84px;height:84px;transform:translate(-21px,-33.7px)}
  .brand-name{top:24px;font-size:10px;letter-spacing:.055em}
  .header-nav{position:absolute;right:var(--pad);bottom:12px;gap:14px}
  .header-nav a{font-size:10px}
  .client{padding:6px 8px}
  .hero{min-height:calc(100dvh - 70px);padding-top:calc(var(--header) + 28px);padding-bottom:32px}
  .hero-bottom{display:flex;flex-direction:column;align-self:end;align-items:stretch;gap:20px}
  .hero-title{font-size:18px}
  .hero-copy{justify-self:auto;width:100%;max-width:none;font-size:13px}
  .scroll-cue{display:none}
  .work{padding-top:54px}
  .services{grid-template-columns:1fr}
  .service{min-height:auto;padding:20px 0 24px}
  .service+.service{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .service h3{margin-top:22px}
  .footer{gap:20px;flex-direction:column}
  .site-footer{min-height:70px}
}
@media(max-width:480px){
  .brand-name{font-size:9px;letter-spacing:.04em}
  .header-nav{gap:12px}
  .site-footer{gap:14px}
  .site-footer a,.site-footer span{font-size:9px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
